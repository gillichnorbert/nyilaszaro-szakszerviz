<section id="gyik" class="container py-5 my-5">
  <div class="text-center mb-5">
    <span class="text-primary fw-bold text-uppercase tracking-wider">Tudnivalók</span>
    <h2 class="display-6 fw-bold mt-2">Gyakran Ismételt Kérdések</h2>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="custom-faq-container">
        
        <div class="faq-card" *ngFor="let faq of faqs" [class.active]="activeFaqId === faq.id">
          
          <button class="faq-header" (click)="toggleFaq(faq.id)">
            <h3 class="faq-question">{{ faq.question }}</h3>
            <div class="faq-icon">
              <i class="bi bi-chevron-down"></i>
            </div>
          </button>
          
          <div class="faq-body-wrapper">
            <div class="faq-body">
              <p>{{ faq.answer }}</p>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>
