<section id="galeria" class="container">
  <div class="text-center mb-5">
    <h2 class="fw-bold">Látványos eredmények</h2>
    <p class="text-muted">Húzd a csúszkát jobbra-balra, hogy lásd a javítás előtti és utáni állapotot!</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="bg-white p-3 rounded-4 shadow-sm">
        
        <div class="position-relative overflow-hidden rounded-3" style="aspect-ratio: 16/9;">
          
          <img src="https://via.placeholder.com/1200x675/5A4634/FFFFFF?text=Javitas+UTAN" 
               class="position-absolute w-100 h-100" style="object-fit: cover; top:0; left:0;">
          
          <img src="https://via.placeholder.com/1200x675/F3EFE9/5A4634?text=Javitas+ELOTT" 
               class="position-absolute w-100 h-100" 
               style="object-fit: cover; top:0; left:0;"
               [style.clip-path]="'polygon(0 0, ' + sliderValue + '% 0, ' + sliderValue + '% 100%, 0 100%)'">
          
          <input type="range" min="0" max="100" [(ngModel)]="sliderValue" 
                 class="position-absolute w-100 h-100 m-0 opacity-0" 
                 style="top:0; left:0; cursor: ew-resize; z-index: 10;">
                 
          <div class="position-absolute h-100 bg-white shadow" 
               style="width: 4px; top:0; pointer-events: none;"
               [style.left]="sliderValue + '%'">
            <div class="position-absolute bg-white rounded-circle shadow d-flex align-items-center justify-content-center" 
                 style="width: 40px; height: 40px; top: 50%; left: 50%; transform: translate(-50%, -50%);">
              <i class="bi bi-arrows-expand fs-5 text-primary" style="transform: rotate(45deg);"></i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
